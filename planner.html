<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀘스트 생성 — QuestLog AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/index.html">QuestLog<span>AI</span></a>
    <nav class="site-nav">
      <a href="/index.html">홈</a>
      <a href="/planner.html" class="is-active">퀘스트 생성</a>
      <a href="/guide.html">모험가 가이드</a>
    </nav>
  </header>

  <main>
    <h1>퀘스트 생성</h1>

    <form id="plan-form" novalidate>
      <div class="field">
        <label for="goal">목표</label>
        <textarea id="goal" name="goal" rows="3" maxlength="500"
                  placeholder="예) 자료구조 중간고사 준비"></textarea>
        <p class="hint"><span id="goal-count">0</span> / 500자</p>
      </div>

      <div class="field">
        <label for="deadline">마감일</label>
        <input type="date" id="deadline" name="deadline">
      </div>

      <div class="field">
        <label for="dailyHours">하루 가능 시간</label>
        <select id="dailyHours" name="dailyHours">
          <option value="30">30분</option>
          <option value="60">1시간</option>
          <option value="120" selected>2시간</option>
          <option value="180">3시간</option>
          <option value="240">4시간</option>
          <option value="360">6시간</option>
        </select>
      </div>

      <div class="field">
        <label for="progress">현재 진행 상황 <span class="optional">(선택)</span></label>
        <textarea id="progress" name="progress" rows="2" maxlength="300"
                  placeholder="예) 연결 리스트까지 공부함"></textarea>
      </div>

      <div class="field">
        <label for="intensity">계획 강도</label>
        <select id="intensity" name="intensity">
          <option value="light">여유롭게</option>
          <option value="normal" selected>보통</option>
          <option value="hard">빡세게</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">AI 계획 생성</button>
    </form>

    <!-- 상태 표시 영역 -->
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" hidden aria-labelledby="plan-title">
      <p id="restored-note" class="restored-note" hidden>
        이전에 생성한 계획입니다. 새로 만들려면 위에서 다시 생성하세요.
      </p>

      <!-- 메인 퀘스트 -->
      <div class="quest-banner">
        <p class="banner-label">메인 퀘스트</p>
        <h2 id="plan-title"></h2>
        <p id="plan-summary" class="banner-summary"></p>
        <ul class="banner-meta">
          <li id="meta-dday"></li>
          <li id="meta-budget"></li>
        </ul>
      </div>

      <!-- 진행도 (브라우저에만 저장) -->
      <div class="xp">
        <div class="xp-head">
          <span>모험 진행도</span>
          <span id="xp-text"></span>
        </div>
        <div class="xp-track"
             role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-label="퀘스트 완료 진행도">
          <div class="xp-fill" id="xp-fill"></div>
        </div>
      </div>

      <p id="budget-warning" class="warning" hidden></p>

      <h3 class="section-title">퀘스트 여정</h3>
      <ol class="timeline" id="timeline"></ol>

      <h3 class="section-title">보스전</h3>
      <div class="boss" id="boss"></div>

      <h3 class="section-title">마지막 점검</h3>
      <ul class="checklist" id="checklist"></ul>

      <h3 class="section-title">주의사항</h3>
      <ul class="cautions" id="cautions"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>QuestLog AI — AI가 생성한 계획은 참고용입니다.</p>
  </footer>

  <script src="/js/planner.js"></script>
</body>
</html>
